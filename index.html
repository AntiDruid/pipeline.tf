<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic TF2 Server Browser</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/list.js/2.3.1/list.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>PIPELINE.TF</h1>

    <div id="server-list">
      <input class="search" placeholder="Search name, map, players, location, ping..." />
      <div class="sort-buttons">
        <button class="sort" data-sort="name">Sort by Name</button>
        <button class="sort" data-sort="players">Sort by Players</button>
        <button class="sort" data-sort="map">Sort by Map</button>
        <button class="sort" data-sort="ping">Sort by Ping</button>
      </div>
      <div class="list grid"></div> <!-- Cards added dynamically -->
    </div>
  </div>

  <script>
    // List.js setup
    var options = {
      valueNames: ['name', 'map', 'players', 'location', 'ping'],
      item: `<div class="card">
               <h3 class="name"></h3>
               <p class="map"></p>
               <p class="players"></p>
               <p class="location"></p>
               <p class="ping"></p>
               <a href="#" class="join-btn">Join</a>
             </div>`
    };
    var serverList = new List('server-list', options);

    // Custom numeric sorts
    function numericSort(field, extractor) {
      return function(a, b) {
        const aNum = extractor(a.values()[field]) || 9999;
        const bNum = extractor(b.values()[field]) || 9999;
        return aNum - bNum;
      };
    }

    // For players: extract before '/' (e.g., 18 from "18/24")
    serverList.sort('players', { sortFunction: numericSort('players', v => parseInt(v.split('/')[0])) });

    // For ping: extract number before ' ms' (e.g., 50 from "50 ms")
    serverList.sort('ping', { sortFunction: numericSort('ping', v => parseInt(v.split(' ')[0])) });

    async function loadServers() {
      try {
        const response = await fetch('http://localhost:3000/api/servers');
        if (!response.ok) throw new Error('Failed to fetch servers');
        const servers = await response.json();

        serverList.clear();
        servers.forEach(s => {
          serverList.add({
            name: s.name,
            map: s.map,
            players: s.players,
            location: s.location,
            ping: s.ping
          });
        });

        // Update join links
        document.querySelectorAll('.join-btn').forEach((btn, i) => {
          btn.href = `steam://connect/${servers[i].ip}`;
        });
      } catch (err) {
        console.error('Error:', err);
        // Fallback: Add a dummy offline card or message
      }
    }

    // Load once + auto-refresh every 30s for live updates
    window.addEventListener('load', loadServers);
    setInterval(loadServers, 30000);
  </script>
</body>
</html>
